resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name app.askr.com.au;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.askr.com.au;

    ssl_certificate /etc/letsencrypt/live/app.askr.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.askr.com.au/privkey.pem;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http://backend:8000/ https://app.askr.com.au/;
        proxy_redirect http://backend/ https://app.askr.com.au/;
        client_max_body_size 10M;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
